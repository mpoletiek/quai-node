# Builds quai-node for every platform on a v* tag (or by hand) and puts the
# binaries, with SHA256SUMS, in a draft GitHub release. Publishing the draft
# is what makes install.sh and install.ps1 pick it up.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.goos }}/${{ matrix.goarch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux and Windows: cgo through zig, from Linux.
          - { goos: linux, goarch: amd64, runner: ubuntu-24.04 }
          - { goos: linux, goarch: arm64, runner: ubuntu-24.04 }
          - { goos: windows, goarch: amd64, runner: ubuntu-24.04 }
          # macOS: the Apple SDK, on a Mac. quai-dash has no macOS release
          # archive yet, so it is built from source there.
          - { goos: darwin, goarch: arm64, runner: macos-14, dash_from_source: "1" }
          - { goos: darwin, goarch: amd64, runner: macos-14, dash_from_source: "1" }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - uses: mlugg/setup-zig@v2
        if: matrix.goos != 'darwin'
        with:
          version: 0.14.1
      - name: Payload
        env:
          GO_QUAI_REF: ${{ vars.GO_QUAI_REF }}
          DASH_VERSION: ${{ vars.DASH_VERSION }}
          DASH_FROM_SOURCE: ${{ matrix.dash_from_source }}
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/build-payload.sh ${{ matrix.goos }} ${{ matrix.goarch }}
      - name: quai-node
        run: make build GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} VERSION=${{ github.ref_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: quai-node-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum quai-node-* > SHA256SUMS
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" --draft --generate-notes
